<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị</title>
    <style>
    /* RESET BẢN LỀ VÀ PHÔNG CHỮ */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f4f6f9;
        color: #333;
        padding: 30px;
        max-width: 1000px;
        margin: 0 auto;
    }

    /* Thanh điều hướng (NAV) */
    nav {
        background-color: #ffffff;
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        margin-bottom: 25px;
    }

    nav a {
        text-decoration: none;
        color: #4a5568;
        font-weight: 600;
        font-size: 15px;
        transition: color 0.2s ease;
    }

    nav a:hover {
        color: #3182ce;
    }

    /* Tiêu đề trang */
    h1 {
        font-size: 26px;
        color: #1a202c;
        margin-bottom: 20px;
        border-left: 5px solid #3182ce;
        padding-left: 12px;
    }

    /* Form Thêm / Sửa Sản Phẩm */
    #product-form {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        margin-bottom: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
    }

    #product-form label {
        font-weight: 600;
        font-size: 14px;
        color: #4a5568;
    }

    #product-form input[type="text"],
    #product-form input[type="number"] {
        padding: 10px 14px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        outline: none;
        font-size: 14px;
        transition: border-color 0.2s;
    }

    #product-form input:focus {
        border-color: #3182ce;
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }

    #submit-btn {
        background-color: #3182ce;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-left: auto;
    }

    #submit-btn:hover {
        background-color: #2b6cb0;
    }

    /* Bảng Danh Sách Sản Phẩm */
    table {
        width: 100%;
        border-collapse: collapse;
        background-color: #ffffff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    th, td {
        padding: 14px 16px;
        text-align: left;
    }

    thead {
        background-color: #2d3748;
        color: #ffffff;
    }

    th {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    tbody tr {
        border-bottom: 1px solid #e2e8f0;
        transition: background-color 0.15s;
    }

    tbody tr:last-child {
        border-bottom: none;
    }

    tbody tr:hover {
        background-color: #f7fafc;
    }
</style>
</head>
<body>
    <nav>
        <a href="index.html">Trang Chủ</a> | 
        <a href="admin.html">Trang Quản Trị</a>
    </nav>

    <h1>Quản Lý Sản Phẩm</h1>

    <!-- Form Thêm / Sửa -->
    <form id="product-form">
        <input type="hidden" id="product-id">
        <label>Tên sản phẩm:</label>
        <input type="text" id="product-name" required>
        <label>Giá sản phẩm:</label>
        <input type="number" id="product-price" required>
        <button type="submit" id="submit-btn">Thêm sản phẩm</button>
    </form>

    <!-- Bảng danh sách sản phẩm -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên sản phẩm</th>
                <th>Giá (VNĐ)</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="admin-product-table"></tbody>
    </table>

    <script src="script.js"></script>
    <script>
        function renderAdminTable() {
            const products = getProducts();
            const tbody = document.getElementById("admin-product-table");
            tbody.innerHTML = "";

            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td>${p.id}</td>
                        <td>${p.name}</td>
                        <td>${p.price.toLocaleString()}</td>
                        <td>
                            <button onclick="editProduct(${p.id})">Sửa</button>
                            <button onclick="deleteProduct(${p.id})">Xóa</button>
                        </td>
                    </tr>
                `;
            });
        }

        // Thêm hoặc Sửa sản phẩm
        document.getElementById("product-form").addEventListener("submit", function(e) {
            e.preventDefault();
            const id = document.getElementById("product-id").value;
            const name = document.getElementById("product-name").value;
            const price = Number(document.getElementById("product-price").value);
            
            let products = getProducts();

            if (id) {
                // Sửa sản phẩm
                products = products.map(p => p.id == id ? { ...p, name, price } : p);
            } else {
                // Thêm sản phẩm mới
                const newProduct = {
                    id: Date.now(),
                    name: name,
                    price: price
                };
                products.push(newProduct);
            }

            saveProducts(products);
            this.reset();
            document.getElementById("product-id").value = "";
            document.getElementById("submit-btn").innerText = "Thêm sản phẩm";
            renderAdminTable();
        });

        // Chọn sản phẩm để Sửa
        function editProduct(id) {
            const products = getProducts();
            const product = products.find(p => p.id == id);
            if (product) {
                document.getElementById("product-id").value = product.id;
                document.getElementById("product-name").value = product.name;
                document.getElementById("product-price").value = product.price;
                document.getElementById("submit-btn").innerText = "Cập nhật sản phẩm";
            }
        }

        // Xóa sản phẩm
        function deleteProduct(id) {
            if (confirm("Bạn có chắc chắn muốn xóa sản phẩm này?")) {
                let products = getProducts();
                products = products.filter(p => p.id != id);
                saveProducts(products);
                renderAdminTable();
            }
        }

        renderAdminTable();
    </script>
</body>
</html>
