<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Trang Quản Trị</title>
    <style>
    /* RESET BẢN LỀ VÀ PHÔNG CHỮ */
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background-color: #f4f6f9;
        color: #333;
        padding: 30px;
        max-width: 1000px;
        margin: 0 auto;
    }

    /* Thanh điều hướng (NAV) */
    nav {
        background-color: #ffffff;
        padding: 15px 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        margin-bottom: 25px;
    }

    nav a {
        text-decoration: none;
        color: #4a5568;
        font-weight: 600;
        font-size: 15px;
        transition: color 0.2s ease;
    }

    nav a:hover {
        color: #3182ce;
    }

    /* Tiêu đề trang */
    h1 {
        font-size: 26px;
        color: #1a202c;
        margin-bottom: 20px;
        border-left: 5px solid #3182ce;
        padding-left: 12px;
    }

    /* Form Thêm / Sửa Sản Phẩm */
    #product-form {
        background-color: #ffffff;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
        margin-bottom: 30px;
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
    }

    #product-form label {
        font-weight: 600;
        font-size: 14px;
        color: #4a5568;
    }

    #product-form input[type="text"],
    #product-form input[type="number"] {
        padding: 10px 14px;
        border: 1px solid #cbd5e0;
        border-radius: 6px;
        outline: none;
        font-size: 14px;
        transition: border-color 0.2s;
    }

    #product-form input:focus {
        border-color: #3182ce;
        box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.15);
    }

    #submit-btn {
        background-color: #3182ce;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: 600;
        cursor: pointer;
        transition: background-color 0.2s;
        margin-left: auto;
    }

    #submit-btn:hover {
        background-color: #2b6cb0;
    }

    /* Bảng Danh Sách Sản Phẩm */
    table {
        width: 100%;
        border-collapse: collapse;
        background-color: #ffffff;
        border-radius: 10px;
        overflow: hidden;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
    }

    th, td {
        padding: 14px 16px;
        text-align: left;
    }

    thead {
        background-color: #2d3748;
        color: #ffffff;
    }

    th {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    tbody tr {
        border-bottom: 1px solid #e2e8f0;
        transition: background-color 0.15s;
    }

    tbody tr:last-child {
        border-bottom: none;
    }

    tbody tr:hover {
        background-color: #f7fafc;
    }
</style>
</head>
<body>
    <nav>
        <a href="index.html">Trang Chủ</a> | 
        <a href="admin.html">Trang Quản Trị</a>
    </nav>

    <h1>Quản Lý Sản Phẩm</h1>

    <!-- Form Thêm / Sửa -->
    <form id="product-form">
        <input type="hidden" id="product-id">
        <label>Tên sản phẩm:</label>
        <input type="text" id="product-name" required>
        <label>Giá sản phẩm:</label>
        <input type="number" id="product-price" required>
        <button type="submit" id="submit-btn">Thêm sản phẩm</button>
    </form>

    <!-- Bảng danh sách sản phẩm -->
    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Tên sản phẩm</th>
                <th>Giá (VNĐ)</th>
                <th>Hành động</th>
            </tr>
        </thead>
        <tbody id="admin-product-table"></tbody>
    </table>

   <script>
    // 1. Khởi tạo dữ liệu mặc định nếu chưa có trong localStorage
    const initialProducts = [
        { id: 1, name: "Nike Air Max 270 Red Special", category: "Nike", price: 3200000, img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80" },
        { id: 2, name: "Puma Future Rider Clean", category: "Puma", price: 2100000, img: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?auto=format&fit=crop&w=800&q=80" },
        { id: 3, name: "Adidas Ultraboost Light 23", category: "Adidas", price: 4500000, img: "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80" },
        { id: 4, name: "Air Jordan 1 Retro High OG", category: "Jordan", price: 5200000, img: "https://images.unsplash.com/photo-1597045566677-8cf032ed6634?auto=format&fit=crop&w=800&q=80" }
    ];

    // Hàm lấy danh sách sản phẩm từ localStorage
    function getProducts() {
        const stored = localStorage.getItem('products');
        if (!stored) {
            localStorage.setItem('products', JSON.stringify(initialProducts));
            return initialProducts;
        }
        return JSON.parse(stored);
    }

    // Hàm hiển thị danh sách sản phẩm ra bảng Admin (Khớp với hình ảnh của bạn)
    function renderAdminTable() {
        const products = getProducts();
        const tbody = document.getElementById("admin-product-table");
        tbody.innerHTML = "";

        products.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.price.toLocaleString('vi-VN')}</td>
                    <td>
                        <button class="btn-delete" style="background:#e74c3c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;" onclick="deleteProduct(${p.id})">Xóa</button>
                    </td>
                </tr>
            `;
        });
    }

    // Xử lý sự kiện khi bấm nút "Thêm sản phẩm" từ Form
    document.getElementById("product-form").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const nameInput = document.getElementById("product-name");
        const priceInput = document.getElementById("product-price");

        const newProduct = {
            id: Date.now(), // Tạo ID tự động dựa trên thời gian
            name: nameInput.value,
            price: Number(priceInput.value),
            category: "Nike", // Mặc định thương hiệu nếu không nhập
            img: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80" // Ảnh mặc định
        };

        const products = getProducts();
        products.push(newProduct);
        localStorage.setItem('products', JSON.stringify(products));

        // Reset form và cập nhật lại bảng
        this.reset();
        renderAdminTable();
        alert("Thêm sản phẩm thành công!");
    });

    // Hàm xóa sản phẩm
    function deleteProduct(id) {
        if (confirm("Bạn có chắc chắn muốn xóa sản phẩm này?")) {
            let products = getProducts();
            products = products.filter(p => p.id !== id);
            localStorage.setItem('products', JSON.stringify(products));
            renderAdminTable();
        }
    }

    // Chạy hiển thị bảng khi trang được tải
    renderAdminTable();
</script>
</body>
</html>
