<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f6f9; }
        .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 320px; }
        .login-card h2 { text-align: center; margin-bottom: 20px; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; margin-bottom: 5px; color: #666; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
        .input-group input:focus { border-color: #007bff; }
        .btn-submit { width: 100%; padding: 10px; background-color: #007bff; color: white; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-submit:hover { background-color: #0056b3; }
        .error-message { color: #dc3545; font-size: 13px; margin-top: 10px; text-align: center; display: none; }
    </style>
</head>
<body>

<div class="login-card">
    <h2>Đăng Nhập</h2>
    <form id="loginForm">
        <div class="input-group">
            <label for="username">Tên đăng nhập</label>
            <input type="text" id="username" required placeholder="Nhập admin">
        </div>
        <div class="input-group">
            <label for="password">Mật khẩu</label>
            <input type="password" id="password" required placeholder="Nhập 123456">
        </div>
        <button type="submit" class="btn-submit">Đăng Nhập</button>
        <p id="errorMsg" class="error-message">Tài khoản hoặc mật khẩu không đúng!</p>
    </form>
</div>

<script>
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const usernameInput = document.getElementById('username').value.trim();
        const passwordInput = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');

        // Kiểm tra tài khoản mẫu
        if (usernameInput === "admin" && passwordInput === "123456") {
            // Lưu trạng thái đăng nhập vào LocalStorage
            localStorage.setItem('isLoggedIn', 'true');
            localStorage.setItem('username', usernameInput);
            
            // Chuyển hướng sang trang chủ
            window.location.href = "index.html";
        } else {
            errorMsg.style.display = "block";
        }
    });
</script>

</body>
</html>
