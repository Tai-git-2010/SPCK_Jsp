<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #eef2f5; }
        .welcome-card { background: white; max-width: 500px; margin: 0 auto; padding: 40px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 20px; }
        .btn-logout { padding: 10px 20px; background-color: #dc3545; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background-color: #bd2130; }
    </style>
</head>
<body>

<div class="welcome-card">
    <h1>Chào mừng trở lại, <span id="userDisplay"></span>!</h1>
    <p>Bạn đã đăng nhập thành công vào trang chủ.</p>
    <button class="btn-logout" onclick="logout()">Đăng xuất</button>
</div>

<script>
    // Kiểm tra xem đã đăng nhập chưa
    if (localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = "login.html";
    } else {
        document.getElementById('userDisplay').textContent = localStorage.getItem('username');
    }

    // Hàm xử lý đăng xuất
    function logout() {
        localStorage.removeItem('isLoggedIn');
        localStorage.removeItem('username');
        window.location.href = "login.html";
    }
</script>

</body>
</html>
